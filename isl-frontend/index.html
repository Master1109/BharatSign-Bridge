<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ISL Connect — real-time Indian Sign Language to text, built for accessible conversation." />
    <meta name="theme-color" content="#1B4B43" />
    <title>ISL Connect</title>
    <script>
      // Apply saved/system theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('isl-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = saved ? saved === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', isDark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
